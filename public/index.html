<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>otomo - 有料版認証</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- 認証画面（未ログイン時に表示） -->
  <div id="auth-container" class="auth-card">
    <h2>🔒 otomo 有料版認証</h2>
    <p style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;">
      メールアドレスとパスワードを入力してログインまたは新規登録してください。
    </p>
    
    <input type="email" id="email" placeholder="メールアドレス" required />
    <input type="password" id="password" placeholder="パスワード（6文字以上）" required />
    
    <button id="login-btn" class="btn-primary">ログイン</button>
    <button id="signup-btn" class="btn-secondary">新規登録</button>
  </div>

  <!-- アプリ本体（ログイン成功時に表示） -->
  <div id="app-container" class="auth-card" style="display: none;">
    <h2>🎉 ようこそ otomo へ！</h2>
    <p id="user-email-display" style="color: #94a3b8; margin-bottom: 20px;"></p>
    <p style="color: #38bdf8; font-size: 14px; margin-bottom: 20px;">認証済みユーザーとしてコンテンツを利用できます。</p>
    <button id="logout-btn" class="btn-secondary" style="background: #ef4444; color: white;">ログアウト</button>
  </div>

  <!-- Firebase (CDN) スクリプト -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // あなたのFirebaseプロジェクト設定
    const firebaseConfig = {
      apiKey: "AIzaSyBailgLJCY2j4YewqhgxIrFBo-wRxixOf8", // ご自身のAPIキーに書き換えてください
      authDomain: "otomo-8f479.firebaseapp.com",
      projectId: "otomo-8f479",
      storageBucket: "otomo-8f479.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const userEmailDisplay = document.getElementById('user-email-display');

    // 認証状態の監視（ログイン状態を保持）
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.style.display = 'none';
        appContainer.style.display = 'block';
        userEmailDisplay.textContent = `ログイン中: ${user.email}`;
      } else {
        authContainer.style.display = 'block';
        appContainer.style.display = 'none';
      }
    });

    // ログインボタンの処理
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        alert('ログインエラー: ' + error.message);
      }
    });

    // 新規登録ボタンの処理
    document.getElementById('signup-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('新規登録とログインが完了しました！');
      } catch (error) {
        alert('登録エラー: ' + error.message);
      }
    });

    // ログアウトボタンの処理
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert('ログアウトエラー: ' + error.message);
      }
    });
  </script>
</body>
</html>
